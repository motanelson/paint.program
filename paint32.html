<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VGA 32x32 Pixel Studio</title>
  <style>
    :root {
      --bg: #1c1d22;
      --panel-bg: #282a30;
      --panel-border: #3d414d;
      --accent: #5555ff;
      --text: #e0e2ec;
      --text-muted: #8c909e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 16px;
      text-align: center;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .badge {
      font-size: 0.75rem;
      background: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      vertical-align: middle;
    }

    .workspace {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-items: flex-start;
      max-width: 1000px;
      width: 100%;
    }

    /* Left Sidebar: Tools & Palette */
    .sidebar {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 260px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .tool-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .btn {
      background: #343740;
      border: 1px solid var(--panel-border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: #424652;
      border-color: #555a68;
    }

    .btn.active {
      background: var(--accent);
      border-color: #7b7bff;
      color: #fff;
    }

    /* VGA Palette Grid */
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .color-swatch {
      aspect-ratio: 1;
      border-radius: 4px;
      cursor: pointer;
      border: 2px solid transparent;
      position: relative;
      transition: transform 0.1s, border-color 0.1s;
    }

    .color-swatch:hover {
      transform: scale(1.08);
    }

    .color-swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
      transform: scale(1.08);
      z-index: 1;
    }

    .color-swatch::after {
      content: attr(data-index);
      position: absolute;
      bottom: 2px;
      right: 3px;
      font-size: 0.65rem;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 2px #000, 0 0 2px #000;
    }

    .current-color-preview {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1c1d22;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
    }

    .preview-box {
      width: 28px;
      height: 28px;
      border-radius: 4px;
      border: 1px solid #fff;
    }

    .preview-label {
      font-size: 0.85rem;
      font-family: monospace;
    }

    /* Canvas Area */
    .canvas-container {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .canvas-wrapper {
      position: relative;
      width: 512px;
      height: 512px;
      background: #fff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      cursor: crosshair;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      display: block;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.8rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    /* Actions Panel */
    .io-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-action {
      width: 100%;
      padding: 10px;
      font-weight: 600;
    }

    .btn-save {
      background: #23633a;
      border-color: #2e844e;
    }
    .btn-save:hover {
      background: #2b7746;
    }

    .btn-load {
      background: #284c7d;
      border-color: #3564a5;
    }
    .btn-load:hover {
      background: #315d9a;
    }

    #file-input {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>VGA Studio <span class="badge">32×32</span></h1>
  </header>

  <div class="workspace">
    <!-- Left Controls Panel -->
    <div class="sidebar">
      <div>
        <div class="section-title">Tools</div>
        <div class="tool-group">
          <button class="btn active" id="tool-pen" title="Pen (B)">Pen</button>
          <button class="btn" id="tool-fill" title="Paint Bucket (F)">Fill</button>
          <button class="btn" id="tool-picker" title="Eyedropper (I)">Pick</button>
        </div>
      </div>

      <div>
        <div class="section-title">Current Color</div>
        <div class="current-color-preview">
          <div class="preview-box" id="preview-box"></div>
          <span class="preview-label" id="preview-label">#FFFFFF [15]</span>
        </div>
      </div>

      <div>
        <div class="section-title">16-Color VGA Palette</div>
        <div class="palette-grid" id="palette"></div>
      </div>

      <div>
        <div class="section-title">Controls</div>
        <div class="tool-group" style="grid-template-columns: repeat(2, 1fr);">
          <button class="btn" id="btn-undo">Undo</button>
          <button class="btn" id="btn-grid">Grid: ON</button>
          <button class="btn" id="btn-clear" style="grid-column: span 2;">Clear Canvas</button>
        </div>
      </div>

      <div>
        <div class="section-title">File Operations (.CSV)</div>
        <div class="io-actions">
          <button class="btn btn-action btn-save" id="btn-save">Save CSV File</button>
          <button class="btn btn-action btn-load" id="btn-load">Load CSV File</button>
          <input type="file" id="file-input" accept=".csv,text/csv">
        </div>
      </div>
    </div>

    <!-- Main Paint Canvas -->
    <div class="canvas-container">
      <div class="canvas-wrapper" id="canvas-wrapper">
        <canvas id="paint-canvas" width="32" height="32"></canvas>
      </div>
      <div class="status-bar">
        <span id="coord-display">X: --, Y: --</span>
        <span>Standard VGA 16-Color</span>
      </div>
    </div>
  </div>

  <script>
    // Standard 16-Color VGA Palette Definition
    const VGA_PALETTE = [
      { name: "Black",         hex: "#000000" }, // 0
      { name: "Blue",          hex: "#0000AA" }, // 1
      { name: "Green",         hex: "#00AA00" }, // 2
      { name: "Cyan",          hex: "#00AAAA" }, // 3
      { name: "Red",           hex: "#AA0000" }, // 4
      { name: "Magenta",       hex: "#AA00AA" }, // 5
      { name: "Brown",         hex: "#AA5500" }, // 6
      { name: "Light Gray",    hex: "#AAAAAA" }, // 7
      { name: "Dark Gray",     hex: "#555555" }, // 8
      { name: "Bright Blue",   hex: "#5555FF" }, // 9
      { name: "Bright Green",  hex: "#55FF55" }, // 10
      { name: "Bright Cyan",   hex: "#55FFFF" }, // 11
      { name: "Bright Red",    hex: "#FF5555" }, // 12
      { name: "Bright Magenta",hex: "#FF55FF" }, // 13
      { name: "Yellow",        hex: "#FFFF55" }, // 14
      { name: "White",         hex: "#FFFFFF" }  // 15
    ];

    const GRID_SIZE = 32;
    let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(15)); // Default to White (15)
    let undoStack = [];

    let currentColorIndex = 0; // Black
    let currentTool = "pen"; // "pen", "fill", "picker"
    let showGrid = true;
    let isDrawing = false;

    // Elements
    const canvas = document.getElementById("paint-canvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const wrapper = document.getElementById("canvas-wrapper");
    const paletteContainer = document.getElementById("palette");
    const previewBox = document.getElementById("preview-box");
    const previewLabel = document.getElementById("preview-label");
    const coordDisplay = document.getElementById("coord-display");

    const toolPen = document.getElementById("tool-pen");
    const toolFill = document.getElementById("tool-fill");
    const toolPicker = document.getElementById("tool-picker");
    const btnGrid = document.getElementById("btn-grid");
    const btnUndo = document.getElementById("btn-undo");
    const btnClear = document.getElementById("btn-clear");
    const btnSave = document.getElementById("btn-save");
    const btnLoad = document.getElementById("btn-load");
    const fileInput = document.getElementById("file-input");

    // Initialize Palette UI
    function initPalette() {
      paletteContainer.innerHTML = "";
      VGA_PALETTE.forEach((color, idx) => {
        const swatch = document.createElement("div");
        swatch.className = `color-swatch ${idx === currentColorIndex ? 'active' : ''}`;
        swatch.style.backgroundColor = color.hex;
        swatch.dataset.index = idx;
        swatch.title = `[${idx}] ${color.name} (${color.hex})`;

        swatch.addEventListener("click", () => {
          selectColor(idx);
        });

        paletteContainer.appendChild(swatch);
      });
      updatePreview();
    }

    function selectColor(index) {
      currentColorIndex = index;
      document.querySelectorAll(".color-swatch").forEach(el => {
        el.classList.toggle("active", parseInt(el.dataset.index, 10) === index);
      });
      updatePreview();
    }

    function updatePreview() {
      const col = VGA_PALETTE[currentColorIndex];
      previewBox.style.backgroundColor = col.hex;
      previewLabel.textContent = `${col.hex} [${currentColorIndex}]`;
    }

    // Save state for undo
    function pushState() {
      if (undoStack.length > 25) undoStack.shift();
      undoStack.push(grid.map(row => [...row]));
    }

    function undo() {
      if (undoStack.length > 0) {
        grid = undoStack.pop();
        drawCanvas();
      }
    }

    // Render Canvas
    function drawCanvas() {
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const colorIdx = grid[y][x];
          ctx.fillStyle = VGA_PALETTE[colorIdx].hex;
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }

    // Overlay visual grid
    function updateGridStyle() {
      if (showGrid) {
        wrapper.style.backgroundImage = `
          linear-gradient(to right, rgba(0,0,0,0.15) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0,0,0,0.15) 1px, transparent 1px)
        `;
        wrapper.style.backgroundSize = `${512 / GRID_SIZE}px ${512 / GRID_SIZE}px`;
      } else {
        wrapper.style.backgroundImage = "none";
      }
    }

    // Flood Fill (BFS)
    function floodFill(startX, startY, targetColor, fillColor) {
      if (targetColor === fillColor) return;
      const queue = [[startX, startY]];

      while (queue.length > 0) {
        const [x, y] = queue.pop();
        if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) continue;
        if (grid[y][x] !== targetColor) continue;

        grid[y][x] = fillColor;

        queue.push([x + 1, y]);
        queue.push([x - 1, y]);
        queue.push([x, y + 1]);
        queue.push([x, y - 1]);
      }
    }

    // Coordinates conversion
    function getCoords(e) {
      const rect = wrapper.getBoundingClientRect();
      const clientX = e.clientX ?? (e.touches ? e.touches[0].clientX : 0);
      const clientY = e.clientY ?? (e.touches ? e.touches[0].clientY : 0);
      
      const x = Math.floor(((clientX - rect.left) / rect.width) * GRID_SIZE);
      const y = Math.floor(((clientY - rect.top) / rect.height) * GRID_SIZE);

      return {
        x: Math.max(0, Math.min(GRID_SIZE - 1, x)),
        y: Math.max(0, Math.min(GRID_SIZE - 1, y))
      };
    }

    function applyTool(x, y) {
      if (currentTool === "pen") {
        if (grid[y][x] !== currentColorIndex) {
          grid[y][x] = currentColorIndex;
          ctx.fillStyle = VGA_PALETTE[currentColorIndex].hex;
          ctx.fillRect(x, y, 1, 1);
        }
      } else if (currentTool === "fill") {
        pushState();
        floodFill(x, y, grid[y][x], currentColorIndex);
        drawCanvas();
      } else if (currentTool === "picker") {
        selectColor(grid[y][x]);
        setTool("pen");
      }
    }

    // Pointer Events for Drag/Draw
    wrapper.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      wrapper.setPointerCapture(e.pointerId);
      isDrawing = true;

      if (currentTool === "pen") pushState();

      const { x, y } = getCoords(e);
      applyTool(x, y);
    });

    wrapper.addEventListener("pointermove", (e) => {
      const { x, y } = getCoords(e);
      coordDisplay.textContent = `X: ${x}, Y: ${y}`;

      if (isDrawing && currentTool === "pen") {
        applyTool(x, y);
      }
    });

    window.addEventListener("pointerup", () => {
      isDrawing = false;
    });

    wrapper.addEventListener("pointerleave", () => {
      coordDisplay.textContent = `X: --, Y: --`;
    });

    // Tool selection handling
    function setTool(tool) {
      currentTool = tool;
      [toolPen, toolFill, toolPicker].forEach(b => b.classList.remove("active"));
      if (tool === "pen") toolPen.classList.add("active");
      if (tool === "fill") toolFill.classList.add("active");
      if (tool === "picker") toolPicker.classList.add("active");
    }

    toolPen.addEventListener("click", () => setTool("pen"));
    toolFill.addEventListener("click", () => setTool("fill"));
    toolPicker.addEventListener("click", () => setTool("picker"));

    btnUndo.addEventListener("click", undo);

    btnGrid.addEventListener("click", () => {
      showGrid = !showGrid;
      btnGrid.textContent = `Grid: ${showGrid ? 'ON' : 'OFF'}`;
      updateGridStyle();
    });

    btnClear.addEventListener("click", () => {
      if (confirm("Clear the entire canvas to white?")) {
        pushState();
        grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(15));
        drawCanvas();
      }
    });

    // Keyboard Shortcuts
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === 'INPUT') return;
      const key = e.key.toLowerCase();
      if (key === 'b') setTool('pen');
      if (key === 'f') setTool('fill');
      if (key === 'i') setTool('picker');
      if ((e.ctrlKey || e.metaKey) && key === 'z') {
        e.preventDefault();
        undo();
      }
    });

    // ==========================================
    // Save to CSV
    // ==========================================
    btnSave.addEventListener("click", () => {
      // Build CSV string: 32 lines separated by \n, each pixel separated by comma
      const csvLines = grid.map(row => row.join(","));
      const csvContent = csvLines.join("\n");

      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `pixel_art_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    });

    // ==========================================
    // Load from CSV
    // ==========================================
    btnLoad.addEventListener("click", () => {
      fileInput.click();
    });

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const text = evt.target.result;
          // Split by newline and strip empty rows/carriage returns
          const lines = text.split(/\r?\n/).filter(line => line.trim().length > 0);

          if (lines.length !== GRID_SIZE) {
            throw new Error(`File has ${lines.length} rows instead of 32.`);
          }

          const newGrid = [];

          for (let y = 0; y < GRID_SIZE; y++) {
            const cells = lines[y].split(",").map(item => item.trim());
            if (cells.length !== GRID_SIZE) {
              throw new Error(`Row ${y + 1} has ${cells.length} columns instead of 32.`);
            }

            const row = [];
            for (let x = 0; x < GRID_SIZE; x++) {
              let val = cells[x];
              let colorIdx = -1;

              // Check if value is a numeric index 0-15
              const parsedInt = parseInt(val, 10);
              if (!isNaN(parsedInt) && parsedInt >= 0 && parsedInt <= 15) {
                colorIdx = parsedInt;
              } else {
                // Alternatively, support hex string parsing
                colorIdx = VGA_PALETTE.findIndex(c => c.hex.toLowerCase() === val.toLowerCase());
              }

              // Fallback to white (15) if unidentified
              if (colorIdx === -1) colorIdx = 15;
              row.push(colorIdx);
            }
            newGrid.push(row);
          }

          pushState();
          grid = newGrid;
          drawCanvas();
          alert("File loaded successfully!");
        } catch (err) {
          alert("Error loading CSV file: " + err.message);
        } finally {
          fileInput.value = ""; // Reset file input
        }
      };

      reader.readAsText(file);
    });

    // Initialize on load
    initPalette();
    drawCanvas();
    updateGridStyle();
  </script>
</body>
</html>
